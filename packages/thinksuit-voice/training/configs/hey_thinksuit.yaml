# Wake word: "Hey ThinkSuit"  (espeak phonemes: hˈeɪ θˈɪŋk sˈuːt)
# First real model. Reproducible from this file: `livekit-wakeword run configs/hey_thinksuit.yaml`
# Requires `setup --config ... --skip-acav` first (Piper weights, MUSAN, RIRs, validation features).
model_name: hey_thinksuit
target_phrases:
  - "Hey ThinkSuit"

custom_negative_phrases: []

tts_backend: piper_vits

# Full first run.
n_samples: 10000
n_samples_val: 2000
n_background_samples: 200
n_background_samples_val: 40

steps: 50000

model:
  model_type: conv_attention
  model_size: small

# ACAV skipped at setup (--skip-acav), so don't sample ACAV negatives.
batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 0
  background_noise: 50

data_dir: ./data
output_dir: ./output
