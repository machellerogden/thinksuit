# Generated by train.py for trigger 'thinksuit_new'. Do not hand-edit — the counts must
# stay stable across initial + augment runs so real-voice mixing offsets line up.
model_name: thinksuit_new
target_phrases:
  - "ThinkSuit New"

custom_negative_phrases: []

